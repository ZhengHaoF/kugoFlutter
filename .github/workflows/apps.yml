name: Android and Windows apps
# Manual entry only; every job also rejects non-main refs and other repositories.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (major.minor.patch)'
        required: true
        default: '0.1.0'
        type: string
      publish:
        description: 'Publish an official GitHub Release after verification'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: apps-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  OVERTONE_VERSION: ${{ inputs.version }}
  OVERTONE_BUILD_NUMBER: ${{ github.run_number }}
jobs:
  quality:
    if: github.repository == 'ZhengHaoF/kugoFlutter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: |
          [[ "$OVERTONE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Version must be major.minor.patch"; exit 1;
          }
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.7'
          path: .flutter-sdk
      - run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Release packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep zip unzip
      - name: Test release packaging and rejection guards
        run: |
          bash tool/test_package_test_release.sh
          bash tool/test_package_release.sh
  android:
    needs: quality
    if: github.repository == 'ZhengHaoF/kugoFlutter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      ORG_GRADLE_PROJECT_overtoneAllowTestSigning: 'false'
      OVERTONE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
      OVERTONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
      OVERTONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.7'
          path: .flutter-sdk
      - run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare production Android signing (required)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_B64 }}
        run: bash tool/prepare_android_signing.sh
      - run: flutter pub get --enforce-lockfile
      - name: Build signed Release APKs for ARM32, ARM64 and x86_64
        run: flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64,android-x64 --build-name "$OVERTONE_VERSION" --build-number "$OVERTONE_BUILD_NUMBER"
      - name: Verify production signatures and package each ABI
        run: bash tool/package_android_release.sh
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/overtone-release-keystore.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: overtone-android-release-${{ github.sha }}
          path: app/build/deliverables/android/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
  windows-media-native:
    if: github.repository == 'ZhengHaoF/kugoFlutter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded installer probe teardown
        run: ./tool/test_installer_probe_helpers.ps1
      - name: Build and exercise native desktop media window
        run: |
          cmake -S tool/native_media_probe -B build/native-media-probe -A x64
          if ($LASTEXITCODE -ne 0) { throw "Native media probe configuration failed" }
          cmake --build build/native-media-probe --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native media probe build failed" }
          & ./build/native-media-probe/Release/native_media_probe.exe |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "native-media.txt")
          if ($LASTEXITCODE -ne 0) { throw "Native media probe failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overtone-native-media-${{ github.sha }}
          path: ${{ runner.temp }}/native-media.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: [quality, windows-media-native]
    if: github.repository == 'ZhengHaoF/kugoFlutter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.7'
          path: .flutter-sdk
      - run: '"$env:GITHUB_WORKSPACE\.flutter-sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - name: Build Windows x64 release bundle
        run: flutter build windows --release --no-pub --build-name "$env:OVERTONE_VERSION" --build-number "$env:OVERTONE_BUILD_NUMBER"
      - name: Download native media acceptance report
        uses: actions/download-artifact@v4
        with:
          name: overtone-native-media-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Verify embedded and running Windows release icons
        run: |
          $report = Join-Path $env:RUNNER_TEMP "release-icons.txt"
          ./tool/test_windows_app_icons.ps1 `
            -Executable "build\windows\x64\runner\Release\overtone.exe" `
            -Report $report
      - name: Package complete portable application
        run: |
          $out = "build\deliverables\windows\portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "build\windows\x64\runner\Release\*" $out -Recurse -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP "release-icons.txt") "$out\NATIVE-ICONS.txt"
          Copy-Item (Join-Path $env:RUNNER_TEMP "native-media.txt") "$out\NATIVE-MEDIA.txt"
          if (-not (Test-Path "$out\overtone.exe")) { throw "Missing application executable" }
          @(
            "泛音 Windows x64 Release"
            "version=$env:OVERTONE_VERSION"
            "build=$env:OVERTONE_BUILD_NUMBER"
            "commit=$env:GITHUB_SHA"
            "run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Authenticode signing: unsigned"
            "Extract the ENTIRE artifact before launching overtone.exe; keep DLLs and data next to it."
            "If the VC++ runtime is missing, install the Microsoft Visual C++ 2015-2022 x64 Redistributable."
            "Physical-device and real-account acceptance remains pending."
          ) | Set-Content "$out\BUILD-INFO.txt" -Encoding utf8
      - name: Native Windows secure storage probe
        run: |
          # The production bundle above is already copied into deliverables.
          flutter build windows --release --no-pub -t tool/native_credential_probe.dart
          if ($LASTEXITCODE -ne 0) { throw "Probe build failed" }
          $report = Join-Path $env:RUNNER_TEMP "native-credentials.txt"
          $exe = (Resolve-Path "build\windows\x64\runner\Release\overtone.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--probe-report=$report" -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force
            throw "Native credential probe timed out"
          }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Native probe failed" }
          $text = Get-Content $report -Raw
          Write-Host $text
          if ($text -match "FAIL" -or ($text | Select-String "PASS" -AllMatches).Matches.Count -ne 5) {
            throw "Native probe evidence incomplete"
          }
          Copy-Item $report "build\deliverables\windows\portable\NATIVE-CREDENTIALS.txt"
      - name: Verify Windows DEBUG runtime icons
        run: |
          # Matches flutter run -d windows; do not distribute Debug binaries.
          # The production Release bundle has already been copied above.
          flutter build windows --debug --no-pub
          if ($LASTEXITCODE -ne 0) { throw "Debug icon acceptance build failed" }
          $report = Join-Path $env:RUNNER_TEMP "debug-icons.txt"
          ./tool/test_windows_app_icons.ps1 `
            -Executable "build\windows\x64\runner\Debug\overtone.exe" `
            -Report $report
          Copy-Item $report "build\deliverables\windows\portable\DEBUG-ICONS.txt"
      - name: Build Windows installer from saved production bundle
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $compiler) { throw "Inno Setup compiler missing" }
          $source = (Resolve-Path "build\deliverables\windows\portable").Path
          $output = Join-Path (Get-Location) "build\deliverables\windows\installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & $compiler "/DAppVersion=$env:OVERTONE_VERSION" "/DSourceDir=$source" "/DOutputDir=$output" "tool\windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer compilation failed" }
      - name: Verify installation, installed app startup and uninstall
        run: |
          ./tool/test_windows_installer.ps1 `
            -Installer "build\deliverables\windows\installer\overtone-$env:OVERTONE_VERSION-windows-x64-setup.exe" `
            -SourceDirectory "build\deliverables\windows\portable" `
            -Report "build\deliverables\windows\INSTALLER-TEST.txt"
      - name: Finalize Windows source identity and checksums
        run: |
          $out = "build\deliverables\windows"
          Copy-Item "$out\portable\BUILD-INFO.txt" "$out\BUILD-INFO.txt"
          $zip = "$out\overtone-${env:OVERTONE_VERSION}-windows-x64-portable.zip"
          7z a -tzip $zip "$out\portable\*"
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP creation failed" }
          7z t $zip
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP verification failed" }
          Get-ChildItem $out -Recurse -File -Force | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path $out), $_.FullName)
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $relative"
          } | Set-Content "$out\SHA256SUMS.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: overtone-windows-x64-release-${{ github.sha }}
          path: app/build/deliverables/windows/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [android, windows]
    # Packaging always runs; public publication requires the extra publish checkbox.
    if: github.repository == 'ZhengHaoF/kugoFlutter' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep zip unzip
      - uses: actions/download-artifact@v4
        with:
          name: overtone-android-release-${{ github.sha }}
          path: release-inputs/android
      - uses: actions/download-artifact@v4
        with:
          name: overtone-windows-x64-release-${{ github.sha }}
          path: release-inputs/windows
      - name: Verify and package release assets
        run: bash app/tool/package_release.sh release-inputs release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: overtone-release-v${{ inputs.version }}-${{ github.sha }}
          path: release-assets/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Publish an official GitHub Release (explicit opt-in)
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$OVERTONE_VERSION"
          assets=(
            "release-assets/overtone-$OVERTONE_VERSION-android-armeabi-v7a.apk"
            "release-assets/overtone-$OVERTONE_VERSION-android-arm64-v8a.apk"
            "release-assets/overtone-$OVERTONE_VERSION-android-x86_64.apk"
            "release-assets/overtone-$OVERTONE_VERSION-windows-x64-setup.exe"
            "release-assets/overtone-$OVERTONE_VERSION-windows-x64-portable.zip"
            "release-assets/ANDROID-SIGNING.txt"
            "release-assets/SHA256SUMS.txt"
            "release-assets/BUILD-INFO.txt"
          )
          # Never overwrite a published version or reuse another commit's draft.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' release-state.json > /dev/null; then
              echo "Version already published. Use a new version; never overwrite."
              exit 1
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA" || {
              echo "Existing draft tag does not match this source commit"; exit 1;
            }
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > existing-tag.json 2>/dev/null; then
              test "$(jq -r '.object.sha' existing-tag.json)" = "$GITHUB_SHA" || {
                echo "Existing version tag belongs to another source commit"; exit 1;
              }
            fi
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Overtone $OVERTONE_VERSION" \
              --notes-file release-assets/RELEASE-NOTES.md \
              --draft --prerelease=false --latest=false
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=false --latest=true
          url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          printf '### GitHub Release\n\n[Download release](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "Published release: $url"
