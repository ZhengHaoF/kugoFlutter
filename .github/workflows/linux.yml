name: Linux P0-P1
on:
  pull_request:
  push:
    branches: [main, feat/linux-p0-p1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Use the verified SDK tag, not a release-index archive lookup.
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: '3.47.7'
          path: .flutter-sdk
      - name: SDK path
        run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libstdc++-12-dev libmpv-dev libepoxy-dev \
            libayatana-appindicator3-dev libasound2-dev zenity \
            xvfb openbox dbus-x11 pulseaudio pulseaudio-utils ffmpeg \
            imagemagick ripgrep weston
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Production release build
        run: |
          flutter build linux --release --no-pub
          mv build/linux/x64/release/bundle build/linux/x64/release/main-bundle
      - name: Native integration probe
        run: |
          flutter build linux --release --no-pub -t tool/linux_integration_probe.dart
          xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- \
            bash tool/run_linux_probe.sh build/linux/x64/release/bundle/kugo \
            build/linux-probe
          KUGO_PROBE_BACKEND=wayland xvfb-run -a -s '-screen 0 1600x1200x24' \
            dbus-run-session -- bash tool/run_linux_probe.sh \
            build/linux/x64/release/bundle/kugo build/linux-probe-wayland
      - name: Upload test evidence and production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.os }}
          path: |
            app/build/linux-probe/probe.log
            app/build/linux-probe/probe.png
            app/build/linux-probe-wayland/probe.log
            app/build/linux-probe-wayland/probe.png
            app/build/linux-probe-wayland/weston.log
            app/build/linux/x64/release/main-bundle
