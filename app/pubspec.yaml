name: kugo
description: "酷狗概念版第三方 Flutter 客户端（学习/研究向）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  dio: ^5.8.0+1
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.0
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.36
  just_audio: ^0.9.46
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  crypto: ^3.0.6
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  qr_flutter: ^4.1.0
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
